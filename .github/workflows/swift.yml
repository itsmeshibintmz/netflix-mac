name: Xcode Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Run tests
      run: xcodebuild -project NetflixMac.xcodeproj -scheme Netflix -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test
    - name: Check ad-hoc release signing
      run: |
        xcodebuild -project NetflixMac.xcodeproj -scheme Netflix -configuration Release -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/netflix-release" CODE_SIGN_IDENTITY=- CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO DEVELOPMENT_TEAM= build
        app="$RUNNER_TEMP/netflix-release/Build/Products/Release/Netflix.app"
        codesign --verify --deep --strict "$app"
        codesign -d --entitlements :- "$app" > "$RUNNER_TEMP/netflix-entitlements.plist"
        test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.cs.disable-library-validation' "$RUNNER_TEMP/netflix-entitlements.plist")" = true
        if /usr/libexec/PlistBuddy -c 'Print :com.apple.security.get-task-allow' "$RUNNER_TEMP/netflix-entitlements.plist" 2>/dev/null | grep -qx true; then
          echo "Release app must not permit debugger attachment" >&2
          exit 1
        fi
